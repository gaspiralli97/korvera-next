<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 52" fill="none">

  <!-- Outer medallion ring -->
  <circle cx="26" cy="26" r="23" fill="#FAF3EE" stroke="#75162D" stroke-width="0.7"/>

  <!-- Thin inner ring -->
  <circle cx="26" cy="26" r="18.5" fill="none" stroke="#75162D" stroke-width="0.4" opacity="0.4"/>

  <!-- 4-petal camellia (brand red + gold alternating) -->
  <!-- Top petal -->
  <path d="M26,26 C22,22 22,14 26,8 C30,14 30,22 26,26 Z" fill="#75162D"/>
  <!-- Right petal -->
  <path d="M26,26 C30,22 38,22 44,26 C38,30 30,30 26,26 Z" fill="#C9A96E"/>
  <!-- Bottom petal -->
  <path d="M26,26 C30,30 30,38 26,44 C22,38 22,30 26,26 Z" fill="#75162D"/>
  <!-- Left petal -->
  <path d="M26,26 C22,30 14,30 8,26 C14,22 22,22 26,26 Z" fill="#C9A96E"/>

  <!-- 4 small diamond accents between petals -->
  <path d="M35.3,16.7 L37,19.3 L35.3,21.9 L33.6,19.3 Z" fill="#75162D" opacity="0.5"/>
  <path d="M35.3,30.1 L37,32.7 L35.3,35.3 L33.6,32.7 Z" fill="#75162D" opacity="0.5"/>
  <path d="M16.7,16.7 L18.4,19.3 L16.7,21.9 L15,19.3 Z" fill="#75162D" opacity="0.5"/>
  <path d="M16.7,30.1 L18.4,32.7 L16.7,35.3 L15,32.7 Z" fill="#75162D" opacity="0.5"/>

  <!-- Center layered circles -->
  <circle cx="26" cy="26" r="6" fill="#FAF3EE"/>
  <circle cx="26" cy="26" r="4" fill="#75162D"/>
  <circle cx="26" cy="26" r="2" fill="#FAF3EE"/>
  <circle cx="26" cy="26" r="0.9" fill="#C9A96E"/>

  <!-- Brand name -->
  <text
    x="60"
    y="30"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-weight="700"
    font-size="19"
    letter-spacing="4"
    fill="#2C2C2C"
  >KORVERA</text>

  <!-- Tagline -->
  <text
    x="62"
    y="42"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-weight="300"
    font-size="7"
    letter-spacing="4"
    fill="#2C2C2C"
  >BEAUTY</text>
</svg>
