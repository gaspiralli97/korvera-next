<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 52" fill="none">
  <!-- Icon background -->
  <rect x="0" y="4" width="44" height="44" rx="10" fill="#F5EDD8"/>

  <!-- Chimney -->
  <rect x="30" y="11" width="5" height="9" rx="1" fill="#2C6E49"/>

  <!-- Roof -->
  <polygon points="22,10 40,26 4,26" fill="#2C6E49"/>

  <!-- Body -->
  <rect x="6" y="25" width="32" height="19" rx="1" fill="#2C6E49"/>

  <!-- Door -->
  <rect x="15" y="32" width="14" height="12" rx="2" fill="#F5EDD8"/>

  <!-- Door knob -->
  <circle cx="26" cy="39" r="1.2" fill="#2C6E49"/>

  <!-- Left window -->
  <rect x="8" y="29" width="6" height="5" rx="1" fill="#F5EDD8"/>

  <!-- Right window -->
  <rect x="26" y="29" width="6" height="5" rx="1" fill="#F5EDD8"/>

  <!-- Brand name -->
  <text
    x="56"
    y="34"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-weight="700"
    font-size="21"
    letter-spacing="3"
    fill="#FFFFFF"
  >KORVERA</text>

  <!-- Tagline -->
  <text
    x="57"
    y="45"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-weight="400"
    font-size="7.5"
    letter-spacing="2.5"
    fill="#F5EDD8"
  >REAL ESTATE</text>
</svg>
