<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 52" fill="none">
  <!-- Icon background -->
  <rect x="0" y="4" width="44" height="44" rx="11" fill="#FAF3EE"/>

  <!-- 5-petal blossom mark (centered at 22, 26) -->
  <g transform="translate(22,26)">
    <!-- Petal 1 -->
    <path d="M0,0 C3,-2 3.5,-9.5 0,-15 C-3.5,-9.5 -3,-2 0,0 Z" fill="#2C1654" transform="rotate(0)"/>
    <!-- Petal 2 -->
    <path d="M0,0 C3,-2 3.5,-9.5 0,-15 C-3.5,-9.5 -3,-2 0,0 Z" fill="#D4849A" transform="rotate(72)"/>
    <!-- Petal 3 -->
    <path d="M0,0 C3,-2 3.5,-9.5 0,-15 C-3.5,-9.5 -3,-2 0,0 Z" fill="#2C1654" transform="rotate(144)"/>
    <!-- Petal 4 -->
    <path d="M0,0 C3,-2 3.5,-9.5 0,-15 C-3.5,-9.5 -3,-2 0,0 Z" fill="#D4849A" transform="rotate(216)"/>
    <!-- Petal 5 -->
    <path d="M0,0 C3,-2 3.5,-9.5 0,-15 C-3.5,-9.5 -3,-2 0,0 Z" fill="#2C1654" transform="rotate(288)"/>
    <!-- Center -->
    <circle cx="0" cy="0" r="4" fill="#FAF3EE"/>
    <circle cx="0" cy="0" r="1.8" fill="#D4849A"/>
  </g>

  <!-- Brand name -->
  <text
    x="58"
    y="31"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-weight="700"
    font-size="19"
    letter-spacing="4"
    fill="#FFFFFF"
  >KORVERA</text>

  <!-- Tagline -->
  <text
    x="60"
    y="43"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-weight="300"
    font-size="7"
    letter-spacing="4"
    fill="#F0C5CC"
  >BEAUTY</text>
</svg>
